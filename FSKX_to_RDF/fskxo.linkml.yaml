  ParameterClassificationEnum:
    description: Classification of a model parameter within the model math.
    permissible_values:
      CONSTANT:
        description: >-
          A parameter whose value is fixed and does not change during model
          execution (e.g. a calibrated rate constant).
      INPUT:
        description: >-
          A parameter supplied externally as input to the model before
          execution (e.g. initial concentration, ambient temperature).
      OUTPUT:
        description: >-
          A parameter produced as a result / output of the model
          (e.g. predicted microbial count, risk estimate).

  ParameterDataTypeEnum:
    description: Data type of a model parameter value.
    permissible_values:
      INTEGER:
        description: Whole-number (integer) value.
      DOUBLE:
        description: Double-precision (64-bit) floating-point value.
      NUMBER:
        description: Generic numeric value; may be integer or floating-point.
      DATE:
        description: Calendar date value formatted according to ISO 8601.
      FILE:
        description: Reference to an external file resource (path or URI).
      BOOLEAN:
        description: Boolean true / false value.
      VECTOROFNUMBERS:
        description: One-dimensional ordered array of numeric values.
      VECTOROFSTRINGS:
        description: One-dimensional ordered array of string values.
      MATRIXOFNUMBERS:
        description: Two-dimensional array (matrix) of numeric values.
      MATRIXOFSTRINGS:
        description: Two-dimensional array (matrix) of string values.
      OBJECT:
        description: Structured / complex object value (arbitrary JSON object).
      STRING:
        description: Free-text string value.
